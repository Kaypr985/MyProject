<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма пользователя</title>
</head>
<body>
<h1 th:text="${user.id != null} ? 'Редактировать пользователя' : 'Добавить пользователя'"></h1>

<form th:action="${user.id != null} ? '/users/update' : '/users'" method="post">
    <input type="hidden" name="id" th:value="${user.id}"/>

    <label>Имя:</label><br/>
    <input type="text" name="name" th:value="${user.name}" required/><br/><br/>

    <label>Email:</label><br/>
    <input type="email" name="email" th:value="${user.email}" required/><br/><br/>

    <button type="submit">Сохранить</button>
</form>

<br/>
<a href="/users">Назад к списку</a>
</body>
</html>
